            docs/reports/passive-insights-progress/ui-conformance-font-matrix.md \
            docs/reports/passive-insights-progress/ui-conformance-computed-styles.json \
            docs/reports/passive-insights-progress/ui-conformance-screenshots.json \
            docs/reports/passive-insights-progress/ui-conformance-summary.json \
            docs/reports/passive-insights-progress/ui-conformance-summary.md \
            docs/reports/passive-insights-progress/qa-hardening-convergence.md \
            docs/reports/2026-08-27-storage-and-guide-load-hardening.md \
            docs/reports/save-synchronized-knowledge-checkpoints.md \
            docs/reports/qa-hardening/stage-07-corpus-evidence.json \
            docs/reports/qa-hardening/stage-07-corpus-evidence.md \
            docs/reports/qa-hardening/stage-07-corpus-execution.json \
            docs/reports/qa-hardening/stage-07-closure.json \
            docs/reports/qa-hardening/stage-07-closure.md \
            docs/reports/qa-hardening/stage-08-closure.json \
