name: Release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New signed tag, such as v1.1.0-rc.33 or v1.1.0
        required: true
        type: string

permissions:
  contents: read
  deployments: read
  actions: read

concurrency:
  group: dualdex-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version_name: ${{ steps.metadata.outputs.version_name }}
      version_code: ${{ steps.metadata.outputs.version_code }}
      release_kind: ${{ steps.metadata.outputs.release_kind }}
      draft: ${{ steps.metadata.outputs.draft }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      application_id: ${{ steps.metadata.outputs.application_id }}
      certificate_sha256: ${{ steps.metadata.outputs.certificate_sha256 }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require exact protected source tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF_TYPE" == "tag" ]] || {
            echo "Release signing must be dispatched from a v1.* tag, not a branch."
            exit 1
          }
          [[ "$WORKFLOW_REF_NAME" == "$RELEASE_TAG" ]] || {
            echo "Input tag $RELEASE_TAG does not match workflow tag $WORKFLOW_REF_NAME."
            exit 1
          }
          [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" == "$GITHUB_SHA" ]]
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: companion-web/package-lock.json

      - name: Install locked web dependencies
        working-directory: companion-web
        run: npm ci

      - name: Test release policy
        run: node --test tools/release/*.test.mjs

      - name: Audit release tag and signing environment policy
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          public_api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          fetch_public_policy() {
            curl --fail --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$public_api/$1"
          }
          ruleset_list="$RUNNER_TEMP/repository-rulesets-list.json"
          rulesets="$RUNNER_TEMP/repository-rulesets.json"
          signing_environment="$RUNNER_TEMP/release-signing-environment.json"
          signing_policies="$RUNNER_TEMP/release-signing-policies.json"
          promotion_environment="$RUNNER_TEMP/release-promotion-environment.json"
          promotion_policies="$RUNNER_TEMP/release-promotion-policies.json"
          fetch_public_policy "rulesets?includes_parents=true&targets=tag" > "$ruleset_list"
          printf '[]\n' > "$rulesets"
          while read -r ruleset_id; do
            [[ "$ruleset_id" =~ ^[0-9]+$ ]]
            detail="$RUNNER_TEMP/repository-ruleset-$ruleset_id.json"
            combined="$RUNNER_TEMP/repository-rulesets-next.json"
            fetch_public_policy "rulesets/$ruleset_id" > "$detail"
            jq --slurp '.[0] + [.[1]]' "$rulesets" "$detail" > "$combined"
            mv "$combined" "$rulesets"
          done < <(jq -r '.[].id' "$ruleset_list")
          fetch_public_policy "environments/release-signing" > "$signing_environment"
          fetch_public_policy "environments/release-signing/deployment-branch-policies" > "$signing_policies"
          fetch_public_policy "environments/release-promotion" > "$promotion_environment"
          fetch_public_policy "environments/release-promotion/deployment-branch-policies" > "$promotion_policies"
          promotion_signing_secret_reference_count=0
          node tools/release/verify-repository-policy.mjs \
            --rulesets "$rulesets" \
            --signing-environment "$signing_environment" \
            --signing-environment-policies "$signing_policies" \
            --promotion-environment "$promotion_environment" \
            --promotion-environment-policies "$promotion_policies" \
            --promotion-signing-secret-reference-count "$promotion_signing_secret_reference_count" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --output "$RUNNER_TEMP/repository-policy.json"

      - name: Validate source-bound compatibility evidence
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sourceCandidateTag=""
          decision_range_end="$GITHUB_SHA"
          if [[ "$RELEASE_TAG" != *-rc.* ]]; then
            test -s release/v1-final-authorization.json
            sourceCandidateTag="$(jq -r '.sourceCandidateTag' release/v1-final-authorization.json)"
            [[ "$sourceCandidateTag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*(-hotfix\.[1-9][0-9]*)?$ ]]
            decision_range_end="$(git rev-parse "$sourceCandidateTag^{commit}")"
          fi
          catalog_schema_path="catalog-store/src/main/kotlin/com/darkaxt/dualdex/catalog/CatalogSchema.kt"
          expected_comparison_revision="$(
            jq -r '
              if .cacheDecision.type == "BUMP_REQUIRED" then .cacheDecision.previousRevision
              elif .cacheDecision.type == "OUTPUT_INVARIANT" then .cacheDecision.revision
              else empty
              end
            ' release/compatibility-evidence.json
          )"
          [[ -z "$expected_comparison_revision" || "$expected_comparison_revision" =~ ^[1-9][0-9]*$ ]]
          decision_range_base_tag=""
          while IFS= read -r candidate; do
            [[ "$candidate" == "$RELEASE_TAG" || "$candidate" == "$sourceCandidateTag" ]] && continue
            if [[ -n "$expected_comparison_revision" ]]; then
              schema_source="$(git show "$candidate:$catalog_schema_path" 2>/dev/null || true)"
              candidate_revision="$(
                printf '%s\n' "$schema_source" |
                  sed -nE 's/^[[:space:]]*const val parserSchemaVersion[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p'
              )"
              [[ "$candidate_revision" == "$expected_comparison_revision" ]] || continue
            fi
            decision_range_base_tag="$candidate"
            break
          done < <(git tag --list 'v1.*' --sort=-version:refname)
          test -n "$decision_range_base_tag"
          decision_range_base="$(git rev-parse "$decision_range_base_tag^{commit}")"
          git diff --name-only "$decision_range_base..$decision_range_end" \
            > "$RUNNER_TEMP/release-decision-paths.txt"
          node tools/release/validate-release-evidence.mjs \
            --manifest release/compatibility-evidence.json \
            --canonical-corpus release/canonical-corpus.json \
            --catalog-schema catalog-store/src/main/kotlin/com/darkaxt/dualdex/catalog/CatalogSchema.kt \
            --comparison-ref "$decision_range_base" \
            --decision-paths "$RUNNER_TEMP/release-decision-paths.txt" \
            --release-commit "$GITHUB_SHA" \
            --repository-root . \
            --output "$RUNNER_TEMP/release-evidence-validation.json"

      - name: Validate published compatibility documentation
        shell: bash
        run: |
          set -euo pipefail
          for document in \
            reports/dualdex-parser-compatibility.json \
            reports/dualdex-parser-compatibility.md \
            reports/dualdex-rom-hacks-compatibility.json \
            reports/dualdex-rom-hacks-compatibility.md \
            docs/reports/2026-08-13-base-first50-release-gate.json \
            docs/reports/2026-08-13-base-first50-release-gate.md \
            docs/reports/2026-08-13-base-full332-compatibility-summary.json \
            docs/reports/2026-08-13-base-full332-compatibility.md \
            docs/reports/2026-08-13-map-first50-release-gate-raw.json \
            docs/reports/2026-08-13-map-first50-release-gate.md \
            docs/reports/2026-08-14-first50-evolution-completeness-raw.json \
            docs/reports/2026-08-14-first50-evolution-completeness.md \
            docs/reports/arm7-first50-compatibility-survey.md \
            docs/reports/2026-08-19-v1.1-player-state-verification.md \
            docs/reports/2026-08-20-unbound-odyssey-static-completion.md \
            docs/reports/2026-08-20-unbound-odyssey-map-completion.md \
            docs/reports/2026-08-20-unbound-odyssey-save-runtime-completion.md \
            docs/reports/2026-08-20-unbound-odyssey-parser-completion.md \
            docs/reports/2026-08-20-rom-derived-companion-theme.md \
            docs/reports/2026-08-20-gen2-gen3-dynamic-local-map-lighting.md \
            docs/reports/2026-08-20-gen1-gen3-table-coverage.json \
            docs/reports/2026-08-20-gen1-gen3-table-coverage.md \
            docs/reports/2026-08-25-unified-game-state-compatibility.json \
            docs/reports/2026-08-25-unified-game-state-final-audit.md \
            docs/reports/passive-insights-progress/party-analysis-compatibility.json \
            docs/reports/passive-insights-progress/party-analysis-audit.md \
            docs/reports/passive-insights-progress/area-guide-compatibility.json \
            docs/reports/passive-insights-progress/area-guide-audit.md \
            docs/reports/passive-insights-progress/progress-timeline-compatibility.json \
            docs/reports/passive-insights-progress/progress-timeline-audit.md \
            docs/reports/passive-insights-progress/specimens-compatibility.json \
