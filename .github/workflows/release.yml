          test -s "$release_notes"
          cp "$release_notes" "$ASSETS/RELEASE_NOTES.md"

          apk_sha256="$(sha256sum "$APK" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
          jq -n \
            --slurpfile compatibilityEvidence "$ASSETS/compatibility-evidence.json" \
            --slurpfile releaseEvidenceValidation "$ASSETS/release-evidence-validation.json" \
            --slurpfile repositoryPolicy "$ASSETS/repository-policy.json" \
            --arg schema "1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg tag "$RELEASE_TAG" \
            --arg releaseKind "$RELEASE_KIND" \
            --arg versionName "$VERSION_NAME" \
            --arg versionCode "$VERSION_CODE" \
            --arg applicationId "com.darkaxt.dualdex" \
            --arg apkSha256 "$apk_sha256" \
            --arg certificateSha256 "$CERTIFICATE_SHA256" \
            '{
              schema: ($schema | tonumber),
              repository: $repository,
              commit: $commit,
              workflowRunId: $workflowRunId,
              tag: $tag,
              releaseKind: $releaseKind,
              versionName: $versionName,
              versionCode: ($versionCode | tonumber),
              applicationId: $applicationId,
              apkSha256: $apkSha256,
              certificateSha256: $certificateSha256,
              signingAuthority: "GitHub protected environment: release-signing",
              compatibilityEvidence: $compatibilityEvidence[0],
              releaseEvidenceValidation: $releaseEvidenceValidation[0],
              repositoryPolicy: $repositoryPolicy[0]
            }' > "$ASSETS/provenance.json"

          (
            cd "$ASSETS"
            sha256sum \
              "$(basename "$APK")" \
              dualdex-release-cert.pem \
              compatibility-evidence.json \
              canonical-corpus.json \
              release-evidence-validation.json \
              repository-policy.json \
              dualdex-parser-compatibility.json \
              dualdex-parser-compatibility.md \
              dualdex-rom-hacks-compatibility.json \
              dualdex-rom-hacks-compatibility.md \
              dualdex-base-first50-release-gate.json \
              dualdex-base-first50-release-gate.md \
              dualdex-base-full332-compatibility-summary.json \
              dualdex-base-full332-compatibility.md \
              dualdex-map-first50-release-gate.json \
              dualdex-map-first50-release-gate.md \
              dualdex-evolution-first50-release-gate.json \
              dualdex-evolution-first50-release-gate.md \
              dualdex-arm7-first50-compatibility.md \
              dualdex-v1.1-player-state-verification.md \
              dualdex-unbound-odyssey-static-completion.md \
              dualdex-unbound-odyssey-map-completion.md \
              dualdex-unbound-odyssey-save-runtime-completion.md \
              dualdex-unbound-odyssey-parser-completion.md \
              dualdex-rom-derived-companion-theme.md \
              dualdex-gen2-gen3-dynamic-local-map-lighting.md \
              dualdex-gen1-gen3-table-coverage.json \
              dualdex-gen1-gen3-table-coverage.md \
              dualdex-unified-game-state-compatibility.json \
              dualdex-unified-game-state-final-audit.md \
              dualdex-party-analysis-compatibility.json \
              dualdex-party-analysis-audit.md \
              dualdex-area-guide-compatibility.json \
              dualdex-area-guide-audit.md \
              dualdex-progress-timeline-compatibility.json \
              dualdex-progress-timeline-audit.md \
              dualdex-specimens-compatibility.json \
              dualdex-specimens-audit.md \
              dualdex-damage-forecast-compatibility.json \
              dualdex-damage-forecast-audit.md \
              dualdex-challenge-expansion-compatibility.json \
              dualdex-challenge-expansion-audit.md \
              dualdex-ui-conformance-audit.md \
              dualdex-ui-conformance-route-matrix.json \
              dualdex-ui-conformance-font-matrix.json \
              dualdex-ui-conformance-font-matrix.md \
              dualdex-ui-conformance-computed-styles.json \
              dualdex-ui-conformance-screenshots.json \
              dualdex-ui-conformance-summary.json \
              dualdex-ui-conformance-summary.md \
              dualdex-qa-hardening-convergence.md \
              dualdex-storage-guide-load-hardening.md \
              dualdex-save-synchronized-knowledge-checkpoints.md \
              dualdex-stage-07-corpus-evidence.json \
              dualdex-stage-07-corpus-evidence.md \
              dualdex-stage-07-corpus-execution.json \
              dualdex-stage-07-closure.json \
              dualdex-stage-07-closure.md \
              dualdex-stage-08-closure.json \
              dualdex-stage-08-closure.md \
              RELEASE_NOTES.md \
              provenance.json > SHA256SUMS.txt
          )

      - name: Reject private data in every public release asset
        shell: bash
        env:
          ASSETS: ${{ steps.signing.outputs.assets }}
        run: node tools/release/validate-public-release-assets.mjs --directory "$ASSETS"

      - name: Create non-replacing GitHub release
        shell: bash
        env:
          ASSETS: ${{ steps.signing.outputs.assets }}
          DRAFT: ${{ needs.verify-and-build.outputs.draft }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify-and-build.outputs.prerelease }}
          RELEASE_KIND: ${{ needs.verify-and-build.outputs.release_kind }}
          RELEASE_TAG: ${{ needs.verify-and-build.outputs.tag }}
          VERSION_NAME: ${{ needs.verify-and-build.outputs.version_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace existing release $RELEASE_TAG."
            exit 1
          fi

          flags=()
          if [[ "$DRAFT" == "true" ]]; then flags+=(--draft); fi
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          title="DualDex $VERSION_NAME"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$title" \
            --notes-file "$ASSETS/RELEASE_NOTES.md" \
            "${flags[@]}" \
            "$ASSETS/DualDex-$RELEASE_TAG.apk" \
            "$ASSETS/SHA256SUMS.txt" \
            "$ASSETS/provenance.json" \
            "$ASSETS/dualdex-release-cert.pem" \
            "$ASSETS/compatibility-evidence.json" \
            "$ASSETS/canonical-corpus.json" \
