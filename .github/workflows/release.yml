          jq -e '.schemaVersion == 1 and .controlCount == 14 and .aggregate.formulaArithmetic.usable == 11 and .aggregate.formulaArithmetic.applicable == 14 and .aggregate.runtimeFormulaEvidence.usable == 5 and .aggregate.runtimeFormulaEvidence.applicable == 14 and .aggregate.forecastOutcome.counts.EXACT == 5 and .aggregate.forecastOutcome.counts.ABSENT == 9 and .aggregate.availableModes.bounded.controls == 5 and .aggregate.organicPrivacy.usable == 14 and (.errors | length) == 0' \
