          jq -e '.schemaVersion == 1 and .controlCount == 14 and .reference.descriptionsClassified.covered == 1003 and .reference.descriptionsClassified.total == 1003 and .reference.templatesExpressible.covered == 1003 and .reference.templatesExpressible.total == 1003 and .aggregate.allApplicableTemplates.covered == 110 and .aggregate.allApplicableTemplates.total == 168 and .aggregate.allFullyObservableTemplates.covered == 104 and .aggregate.allFullyObservableTemplates.total == 110 and .aggregate.allValidatedTemplates.covered == 104 and .aggregate.allValidatedTemplates.total == 104 and (.errors | length) == 0' \
