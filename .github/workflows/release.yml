name: Release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New signed tag, such as v1.1.0-rc.33 or v1.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dualdex-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version_name: ${{ steps.metadata.outputs.version_name }}
      version_code: ${{ steps.metadata.outputs.version_code }}
      release_kind: ${{ steps.metadata.outputs.release_kind }}
      draft: ${{ steps.metadata.outputs.draft }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      application_id: ${{ steps.metadata.outputs.application_id }}
      certificate_sha256: ${{ steps.metadata.outputs.certificate_sha256 }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require exact protected source tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF_TYPE" == "tag" ]] || {
            echo "Release signing must be dispatched from a v1.* tag, not a branch."
            exit 1
          }
          [[ "$WORKFLOW_REF_NAME" == "$RELEASE_TAG" ]] || {
            echo "Input tag $RELEASE_TAG does not match workflow tag $WORKFLOW_REF_NAME."
            exit 1
          }
          [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" == "$GITHUB_SHA" ]]
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: companion-web/package-lock.json

      - name: Install locked web dependencies
        working-directory: companion-web
        run: npm ci

      - name: Test release policy
        run: node --test tools/release/*.test.mjs

      - name: Validate published compatibility documentation
        shell: bash
        run: |
          set -euo pipefail
          for document in \
            reports/dualdex-parser-compatibility.json \
            reports/dualdex-parser-compatibility.md \
            reports/dualdex-rom-hacks-compatibility.json \
            reports/dualdex-rom-hacks-compatibility.md \
            docs/reports/2026-08-13-base-first50-release-gate.json \
            docs/reports/2026-08-13-base-first50-release-gate.md \
            docs/reports/2026-08-13-base-full332-compatibility-summary.json \
            docs/reports/2026-08-13-base-full332-compatibility.md \
            docs/reports/2026-08-13-map-first50-release-gate-raw.json \
            docs/reports/2026-08-13-map-first50-release-gate.md \
            docs/reports/2026-08-14-first50-evolution-completeness-raw.json \
            docs/reports/2026-08-14-first50-evolution-completeness.md \
            docs/reports/arm7-first50-compatibility-survey.md \
            docs/reports/2026-08-19-v1.1-player-state-verification.md \
            docs/reports/2026-08-20-unbound-odyssey-static-completion.md \
            docs/reports/2026-08-20-unbound-odyssey-map-completion.md \
            docs/reports/2026-08-20-unbound-odyssey-save-runtime-completion.md \
            docs/reports/2026-08-20-unbound-odyssey-parser-completion.md \
            docs/reports/2026-08-20-rom-derived-companion-theme.md \
            docs/reports/2026-08-20-gen2-gen3-dynamic-local-map-lighting.md \
            docs/reports/2026-08-20-gen1-gen3-table-coverage.json \
            docs/reports/2026-08-20-gen1-gen3-table-coverage.md \
            docs/reports/2026-08-25-unified-game-state-compatibility.json \
            docs/reports/2026-08-25-unified-game-state-final-audit.md \
            docs/reports/passive-insights-progress/party-analysis-compatibility.json \
            docs/reports/passive-insights-progress/party-analysis-audit.md \
            docs/reports/passive-insights-progress/area-guide-compatibility.json \
            docs/reports/passive-insights-progress/area-guide-audit.md \
            docs/reports/passive-insights-progress/progress-timeline-compatibility.json \
            docs/reports/passive-insights-progress/progress-timeline-audit.md \
            docs/reports/passive-insights-progress/specimens-compatibility.json \
            docs/reports/passive-insights-progress/specimens-audit.md \
            docs/reports/passive-insights-progress/damage-forecast-compatibility.json \
            docs/reports/passive-insights-progress/damage-forecast-audit.md \
            docs/reports/passive-insights-progress/challenge-expansion-compatibility.json \
            docs/reports/passive-insights-progress/challenge-expansion-audit.md \
            docs/reports/passive-insights-progress/ui-conformance-audit.md \
            docs/reports/passive-insights-progress/ui-conformance-route-matrix.json \
            docs/reports/passive-insights-progress/ui-conformance-font-matrix.json \
            docs/reports/passive-insights-progress/ui-conformance-font-matrix.md \
            docs/reports/passive-insights-progress/ui-conformance-computed-styles.json \
            docs/reports/passive-insights-progress/ui-conformance-screenshots.json \
            docs/reports/passive-insights-progress/ui-conformance-summary.json \
            docs/reports/passive-insights-progress/ui-conformance-summary.md \
            docs/reports/passive-insights-progress/qa-hardening-convergence.md \
            docs/reports/2026-08-27-storage-and-guide-load-hardening.md \
            docs/reports/save-synchronized-knowledge-checkpoints.md \
            release/POST_RELEASE_CHECKLIST.md; do
            test -s "$document"
          done
          jq -e '.schemaVersion == 11 and (.results | length) == 50' \
            reports/dualdex-parser-compatibility.json >/dev/null
          jq -e '.schemaVersion == 1 and .reportSchemaVersion == 11 and .romCount == 50' \
            reports/dualdex-rom-hacks-compatibility.json >/dev/null
          jq -e '.schemaVersion == 1 and .uniqueSha256Identities == 332 and .exactRehashes == 332 and .statusDistribution.ERROR == 0' \
            docs/reports/2026-08-13-base-full332-compatibility-summary.json >/dev/null
          jq -e '.schemaVersion == 1 and (.rows | length) == 50 and .summary.statusDistribution.SELECTED == 50 and .summary.exactRehashes == 50 and .summary.deterministicRoutes == 50 and .summary.referenceClosed == 50 and .summary.persistedAndReopened == 50 and .summary.sqliteQuickCheckOk == 50 and .summary.sqliteForeignKeyErrors == 0' \
            docs/reports/2026-08-13-base-first50-release-gate.json >/dev/null
          jq -e '.summary.completed == 50 and .summary.available >= 25 and .summary.deterministic == 50 and .summary.safeNoMapFallback == (50 - .summary.available) and (.observations | length) == 50' \
            docs/reports/2026-08-13-map-first50-release-gate-raw.json >/dev/null
          jq -e '.summary.identities == 50 and .summary.completeTables == 50 and .summary.malformedRows == 0 and .summary.deterministicHashes == 50 and .summary.sqliteReopenExact == 50 and .summary.originalCompleteTablesPreserved == .summary.originalCompleteTables and (.rows | length) == 50' \
            docs/reports/2026-08-14-first50-evolution-completeness-raw.json >/dev/null
          jq -e '.schemaVersion == 1 and .uniqueRomCount == 331 and (.tableCoverage | length) == 23 and .corpusAudit.inputRows == 333 and .corpusAudit.duplicateRowsRemoved == 2 and .corpusAudit.parserErrors == 0 and .corpusAudit.selectedWithoutPersistence == 0 and .deltaValidation.status == "SELECTED" and .deltaValidation.compatibilityPercent == 82.21 and .deltaValidation.persisted == true' \
            docs/reports/2026-08-20-gen1-gen3-table-coverage.json >/dev/null
          jq -e '.schemaVersion == 1 and .controlCount == 14 and .fieldCount == 9 and .cohortSummary.allControls.available == 90 and .cohortSummary.allControls.total == 126 and .cohortSummary.allControls.percent == 71.43 and .recoveryControls.checkpointWriteOnlyOnChangedSave.percent == 100 and .retainedRawBytes == 0' \
            docs/reports/2026-08-25-unified-game-state-compatibility.json >/dev/null
          jq -e '.schemaVersion == 1 and .controlCount == 14 and .aggregate.partyFields.covered == 48 and .aggregate.partyFields.total == 84 and .aggregate.moves.percent == 100 and .aggregate.moveCategories.covered == 4737 and .aggregate.moveCategories.total == 4785 and .aggregate.typeChart.percent == 100 and .aggregate.evolutions.percent == 100 and .aggregate.provenAbilityModifiers.covered == 30 and .aggregate.provenAbilityModifiers.total == 849 and (.controls | all(.catalogPersistedAndReopened == true)) and (.errors | length) == 0' \
            docs/reports/passive-insights-progress/party-analysis-compatibility.json >/dev/null
          jq -e '.schemaVersion == 1 and .controlCount == 14 and .aggregate.areaNames.covered == 3973 and .aggregate.areaNames.total == 4979 and .aggregate.exits.covered == 7848 and .aggregate.exits.total == 10513 and .aggregate.encounterSpecies.percent == 100 and .aggregate.encounterWindows.percent == 100 and .aggregate.encounterLevels.covered == 23152 and .aggregate.encounterLevels.total == 23167 and .aggregate.encounterRates.percent == 100 and .aggregate.localMaps.percent == 100 and .aggregate.poiBearingMaps.covered == 4737 and .aggregate.poiBearingMaps.total == 4978 and .aggregate.poiContent.covered == 5881 and .aggregate.poiContent.total == 25003 and .aggregate.filters.percent == 100 and (.controls | all(.catalogPersistedAndReopened == true)) and (.errors | length) == 0' \
            docs/reports/passive-insights-progress/area-guide-compatibility.json >/dev/null
          jq -e '.schemaVersion == 1 and .controlCount == 14 and .reference.classified.covered == 883 and .reference.classified.total == 1003 and .reference.expressible.percent == 100 and .aggregate.currentTotalFields.covered == 40 and .aggregate.currentTotalFields.total == 70 and .aggregate.observableEventFamilies.covered == 108 and .aggregate.observableEventFamilies.total == 126 and .aggregate.baselineApplicableTemplates.covered == 66 and .aggregate.baselineApplicableTemplates.total == 84 and .aggregate.fullyObservableTemplates.covered == 66 and .aggregate.fullyObservableTemplates.total == 66 and .aggregate.validatedTemplates.covered == 66 and .aggregate.validatedTemplates.total == 66 and (.errors | length) == 0' \
            docs/reports/passive-insights-progress/progress-timeline-compatibility.json >/dev/null
          jq -e '.schemaVersion == 1 and .controlCount == 14 and .aggregate.applicableFields.covered == 148 and .aggregate.applicableFields.total == 178 and .aggregate.applicableFields.percent == 83.15 and .aggregate.applicableSources.covered == 77 and .aggregate.applicableSources.total == 84 and .aggregate.applicableSources.percent == 91.67 and .cohorts.officialGen1.covered == 18 and .cohorts.officialGen1.total == 30 and .cohorts.officialGen2.covered == 18 and .cohorts.officialGen2.total == 36 and .cohorts.officialGen3.covered == 70 and .cohorts.officialGen3.total == 70 and .cohorts.sourceBackedHacks.covered == 42 and .cohorts.sourceBackedHacks.total == 42 and (.errors | length) == 0' \
            docs/reports/passive-insights-progress/specimens-compatibility.json >/dev/null
          jq -e '.schemaVersion == 1 and .controlCount == 14 and .aggregate.formulaArithmetic.usable == 11 and .aggregate.formulaArithmetic.applicable == 14 and .aggregate.runtimeFormulaEvidence.usable == 5 and .aggregate.runtimeFormulaEvidence.applicable == 14 and .aggregate.forecastOutcome.counts.EXACT == 5 and .aggregate.forecastOutcome.counts.ABSENT == 9 and .aggregate.availableModes.bounded.controls == 5 and .aggregate.organicPrivacy.usable == 14 and (.errors | length) == 0' \
            docs/reports/passive-insights-progress/damage-forecast-compatibility.json >/dev/null
          jq -e '.schemaVersion == 1 and .controlCount == 14 and .reference.descriptionsClassified.covered == 883 and .reference.descriptionsClassified.total == 1003 and .reference.templatesExpressible.covered == 883 and .reference.templatesExpressible.total == 883 and .aggregate.allApplicableTemplates.covered == 110 and .aggregate.allApplicableTemplates.total == 168 and .aggregate.allFullyObservableTemplates.covered == 104 and .aggregate.allFullyObservableTemplates.total == 110 and .aggregate.allValidatedTemplates.covered == 104 and .aggregate.allValidatedTemplates.total == 104 and (.errors | length) == 0' \
            docs/reports/passive-insights-progress/challenge-expansion-compatibility.json >/dev/null
          jq -e '.schemaVersion == 1 and .viewport.width == 1024 and .viewport.height == 768 and .routeCount == 28 and .themeCount == 9 and .fontScaleCount == 3 and .matrixRows == 756 and (.gates | all(. == true)) and (.errors | length) == 0' \
            docs/reports/passive-insights-progress/ui-conformance-summary.json >/dev/null
          jq -e '.schemaVersion == 1 and (.routes | length) == 28 and (.themes | length) == 9 and (.fontScales | length) == 3' \
            docs/reports/passive-insights-progress/ui-conformance-route-matrix.json >/dev/null
          for matrix in \
            docs/reports/passive-insights-progress/ui-conformance-font-matrix.json \
            docs/reports/passive-insights-progress/ui-conformance-computed-styles.json \
            docs/reports/passive-insights-progress/ui-conformance-screenshots.json; do
            jq -e '.schemaVersion == 1 and (.rows | length) == 756 and (.errors | length) == 0' "$matrix" >/dev/null
          done
          jq -e '.baseFirst50Selected == 50 and .mapFirst50Available == 26 and .evolutionFirst50Complete == 50 and .secureBuildDependencyGate == true and .securityAdvisoriesCovered == 48 and .arm7Applicable == 46 and .arm7ProductionComplete == 38 and .v11Stage1NormalizedLiveStateModels == true and .v11Stage1DetailedGen3PartyCodec == true and .v11Stage1Gen3TrainerBagSaveCodec == true and .v11Stage2EmeraldRuntimeLayout == true and .v11Stage2TrainerAssets == true and .v11Stage2CatalogPersistence == true and .v11Stage2TrainerAssetApi == true and .v11Stage3PointerFirstSnapshot == true and .v11Stage3IndependentLiveSections == true and .v11Stage3LiveOverSaveAuthority == true and .v11Stage3LifecycleFallback == true and .v11Stage4TrainerCard == true and .v11Stage4PartyPresentation == true and .v11Stage4DynamicFeatureNavigation == true and .v11Stage4LocalMapConvergence == true and .v11Stage5DisplayContinuityPolicy == true and .v11Stage5DisplayLifecycleRecovery == true and .v11Stage6OfficialEmeraldVertical == true and .v11Stage6UnsupportedDescriptorFallback == true and .v11Stage6OpponentMovePrivacy == true and .v11Rc4HotfixBoundedRomIndex == true and .v11Rc4HotfixBoundedAbilityCfg == true and .v11Rc7LoadingProgressAndAtlasChrome == true and .v11Rc8CatalogCacheRebuild == true and .v11Rc9CompleteLocalMapCatalog == true and .v11Rc9TruthfulAtlasLocation == true and .v11Rc13PermanentAtlasMarkers == true and .v11Rc13SourceAwareClockOrbit == true and .v11Rc15PlayerStateIntegrationGate == true and .v11Rc15DisplayRecovery == true and .v11Rc16DoubleBattleCommandOwnership == true and .v11Rc16MatchupEvidenceMigration == true and .v11Stage8NormalizedPartyArtwork == true and .v11Stage8PrivacySafePartyFallbacks == true and .v11Stage8PartyBrowserGate == true and .v11Rc18UnboundOdysseyParserComplete == true and .v11Rc18UnboundOdysseyMapComplete == true and .v11Rc18OdysseySaveRuntimeComplete == true and .v11Rc18UnboundExpandedSaveAbi == true and .v11Rc18RomDerivedTheme == true and .v11Rc18ThemePersistenceAndApi == true and .v11Rc18ThemeBrowserGate == true and .v11Rc19Gen2DynamicLocalMaps == true and .v11Rc19Gen3TimedLocalMaps == true and .v11Rc19DynamicMapPersistenceAndApi == true and .v11Rc19DynamicMapWebGate == true and .v11Rc20ArchiveContainerIdentity == true and .v11Rc21WideAbilityDomainFailClosed == true and .v11Rc22GranularLoadingProgress == true and .v11Rc22SaveScopedKnowledgeIntegrity == true and .v11Rc22OrganicPositiveStatus == true and .v11Rc22AdaptiveClockContrast == true and .v11Rc23Gen1CompiledRelationships == true and .v11Rc23Gen1CompiledTypeChart == true and .v11Rc23Gen1OptionalFailureIsolation == true and .v11Rc24PokedexCaughtPortraitBadge == true and .v11Rc24InteractivePartyRoster == true and .v11Rc24CohesiveTrainerCard == true and .v11Rc24PartyExperienceProgress == true and .v11Rc25Gen1CompiledMoveDomain == true and .v11Rc25Gen1CompiledMachineMoves == true and .v11Rc25Gen1ExpandedMachineDomain == true and .v11Rc25Gen1CompiledDescriptions == true and .v11Rc25Gen1RecordSpriteBanks == true and .v11Rc28RomDerivedNatureCatalog == true and .v11Rc30SharpLocalRaster == true and .v11Rc30PlayerCenteredRecenter == true and .v11Rc30DiscoverySafeLocalLoading == true and .v11Rc30RomDerivedMapAvatar == true and .v11Rc31ThemeConsolidation == true and .v11Rc31NatureResolutionSupport == true and .v11Rc31GlobalLocalMapRendering == true and .gen1CompiledEvolutionCoveragePercent == 96.62 and .gen1CompiledLearnsetCoveragePercent == 93.56 and .gen1CompiledTypeChartCoveragePercent == 95.79 and .gen1MoveCatalogCoveragePercent == 90.24 and .gen1MoveDetailsCoveragePercent == 90.42 and .gen1MachineMoveCoveragePercent == 86.32 and .gen1SpriteCoveragePercent == 88.31 and .gen1PokedexDescriptionCoveragePercent == 89.47 and .gen1Gen3CoverageUniqueRoms == 331 and .gen1Gen3CoverageTables == 23 and .gen1Gen3CoverageParserErrors == 0 and (has("debugApkSha256") | not)' \
            release/v1-ready.json >/dev/null
          jq -e '.v11Rc32PersistentLocalMapDiscovery == true' release/v1-ready.json >/dev/null
          jq -e '.v11Rc33Gen3LocalMapPois == true and .v11Rc33PoiEventFlagTracking == true' release/v1-ready.json >/dev/null
          jq -e '.v11Rc36ConditionalPoiNames == true and .v11Rc36PoiZoomDecluttering == true' release/v1-ready.json >/dev/null
          jq -e '.v11Rc37LiveTrainerIdentity == true and .v11Rc37PoiLabelClarity == true and .v11Rc37LoadingTitleSpacing == true' release/v1-ready.json >/dev/null
          jq -e '.v11Rc38PossessivePoiFallback == true and .v11Rc38AdaptivePoiLabelPlacement == true' release/v1-ready.json >/dev/null
          jq -e '.v11Rc39AndroidBootstrapState == true' release/v1-ready.json >/dev/null
          jq -e '.v11Rc40LiveViewPriority == true and .v11Rc40PlayerFollow == true' release/v1-ready.json >/dev/null
          jq -e '.v11Rc63UnifiedTransientState == true and .v11Rc63CanonicalPokedexReplacement == true and .v11Rc63SaveChangedOnlyCheckpoint == true and .v11Rc63CrossGenerationLiveControls == true' release/v1-ready.json >/dev/null
          jq -e '.v11Rc67VisibleHeightScaling == true and .v11Rc67AlphaTrimmedComparisonSprites == true and .v11Rc67HeightBrowserGate == true' release/v1-ready.json >/dev/null
          jq -e '.v11Rc68PartyAnalysis == true' release/v1-ready.json >/dev/null
          jq -e '.v11Rc69AreaGuide == true' release/v1-ready.json >/dev/null
          jq -e '.v11Rc70TrainerProgressTimeline == true' release/v1-ready.json >/dev/null
          jq -e '.v11Rc71StorageGuideLoadHardening == true' release/v1-ready.json >/dev/null
          jq -e '.v11Rc72PokedexSpecimens == true' release/v1-ready.json >/dev/null
          jq -e '.v11Rc73DamageForecast == true' release/v1-ready.json >/dev/null
          jq -e '.v11Rc76PortableChallengeExpansion == true' release/v1-ready.json >/dev/null
          jq -e '.v11Stage7CrossFeatureUiConformance == true' release/v1-ready.json >/dev/null
          jq -e '.v11SaveSynchronizedKnowledgeCheckpoints == true' release/v1-ready.json >/dev/null
          if grep -Eiq '[A-Z]:\\|dualdex-expanded-corpus|ExtractedPath' \
            reports/dualdex-parser-compatibility.json \
            reports/dualdex-parser-compatibility.md \
            reports/dualdex-rom-hacks-compatibility.json \
            reports/dualdex-rom-hacks-compatibility.md \
            docs/reports/2026-08-13-base-first50-release-gate.json \
            docs/reports/2026-08-13-base-first50-release-gate.md \
            docs/reports/2026-08-13-base-full332-compatibility-summary.json \
            docs/reports/2026-08-13-base-full332-compatibility.md \
            docs/reports/2026-08-13-map-first50-release-gate-raw.json \
            docs/reports/2026-08-13-map-first50-release-gate.md \
            docs/reports/2026-08-14-first50-evolution-completeness-raw.json \
            docs/reports/2026-08-14-first50-evolution-completeness.md \
            docs/reports/arm7-first50-compatibility-survey.md \
            docs/reports/2026-08-19-v1.1-player-state-verification.md \
            docs/reports/2026-08-20-unbound-odyssey-static-completion.md \
            docs/reports/2026-08-20-unbound-odyssey-map-completion.md \
            docs/reports/2026-08-20-unbound-odyssey-save-runtime-completion.md \
            docs/reports/2026-08-20-unbound-odyssey-parser-completion.md \
            docs/reports/2026-08-20-rom-derived-companion-theme.md \
            docs/reports/2026-08-20-gen2-gen3-dynamic-local-map-lighting.md \
            docs/reports/2026-08-20-gen1-gen3-table-coverage.json \
            docs/reports/2026-08-20-gen1-gen3-table-coverage.md \
            docs/reports/2026-08-25-unified-game-state-compatibility.json \
            docs/reports/2026-08-25-unified-game-state-final-audit.md \
            docs/reports/passive-insights-progress/party-analysis-compatibility.json \
            docs/reports/passive-insights-progress/party-analysis-audit.md \
            docs/reports/passive-insights-progress/area-guide-compatibility.json \
            docs/reports/passive-insights-progress/area-guide-audit.md \
            docs/reports/passive-insights-progress/progress-timeline-compatibility.json \
            docs/reports/passive-insights-progress/progress-timeline-audit.md \
            docs/reports/passive-insights-progress/specimens-compatibility.json \
            docs/reports/passive-insights-progress/specimens-audit.md \
            docs/reports/passive-insights-progress/damage-forecast-compatibility.json \
            docs/reports/passive-insights-progress/damage-forecast-audit.md \
            docs/reports/passive-insights-progress/challenge-expansion-compatibility.json \
            docs/reports/passive-insights-progress/challenge-expansion-audit.md \
            docs/reports/passive-insights-progress/ui-conformance-audit.md \
            docs/reports/passive-insights-progress/ui-conformance-route-matrix.json \
            docs/reports/passive-insights-progress/ui-conformance-font-matrix.json \
            docs/reports/passive-insights-progress/ui-conformance-font-matrix.md \
            docs/reports/passive-insights-progress/ui-conformance-computed-styles.json \
            docs/reports/passive-insights-progress/ui-conformance-screenshots.json \
            docs/reports/passive-insights-progress/ui-conformance-summary.json \
            docs/reports/passive-insights-progress/ui-conformance-summary.md \
            docs/reports/passive-insights-progress/qa-hardening-convergence.md \
            docs/reports/2026-08-27-storage-and-guide-load-hardening.md \
            docs/reports/save-synchronized-knowledge-checkpoints.md; then
            echo 'Compatibility documentation contains a private path.'
            exit 1
          fi

      - name: Test Android deployment safety
        run: pwsh -File tools/android/Test-DualDexAndroidTools.ps1

      - name: Derive and validate release identity
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git tag --list 'v*' > "$RUNNER_TEMP/existing-release-tags.txt"
          args=(
            --tag "$RELEASE_TAG"
            --ready release/v1-ready.json
            --certificate-fingerprint signing/dualdex-release-cert.sha256
            --existing-tags "$RUNNER_TEMP/existing-release-tags.txt"
          )
          if [[ -f release/v1-final-authorization.json ]]; then
            args+=(--final-authorization release/v1-final-authorization.json)
          fi
          node tools/release/derive-release-metadata.mjs "${args[@]}"

      - name: Refuse an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace existing release $RELEASE_TAG. Use a new monotonically versioned RC."
            exit 1
          fi

      - name: Test web UI
        working-directory: companion-web
        run: npm test -- --run

      - name: Install Playwright Chromium
        working-directory: companion-web
        run: npx playwright install --with-deps chromium

      - name: Run public Chromium acceptance
        working-directory: companion-web
        run: npm run test:e2e:ci

      - name: Build web UI
        working-directory: companion-web
        run: npm run build

      - name: Test all modules, lint, and build unsigned release APK
        shell: bash
        run: >-
          bash ./gradlew verifySecureBuildDependencies test :app:lintDebug :app:assembleRelease
          -PdualdexVersionName=${{ steps.metadata.outputs.version_name }}
          -PdualdexVersionCode=${{ steps.metadata.outputs.version_code }}
          --stacktrace

      - name: Verify unsigned package identity
        shell: bash
        env:
          EXPECTED_APPLICATION_ID: ${{ steps.metadata.outputs.application_id }}
          EXPECTED_VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: |
          set -euo pipefail
          unsigned_apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$unsigned_apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          badging="$("$aapt" dump badging "$unsigned_apk" | head -n 1)"
          [[ "$badging" == *"name='$EXPECTED_APPLICATION_ID'"* ]]
          [[ "$badging" == *"versionCode='$EXPECTED_VERSION_CODE'"* ]]
          [[ "$badging" == *"versionName='$EXPECTED_VERSION_NAME'"* ]]

      - name: Stage unsigned build handoff
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dualdex-unsigned"
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/dualdex-unsigned/DualDex-$RELEASE_TAG-unsigned.apk"

      - name: Upload unsigned build handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dualdex-unsigned-${{ steps.metadata.outputs.tag }}
          path: ${{ runner.temp }}/dualdex-unsigned/DualDex-${{ steps.metadata.outputs.tag }}-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  packaged-android-acceptance:
    name: Packaged Android acceptance
    uses: ./.github/workflows/packaged-android.yml

  sign-and-publish:
    needs: [verify-and-build, packaged-android-acceptance]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
    steps:
      - name: Check out exact verified source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: "21"

      - name: Download unsigned build handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dualdex-unsigned-${{ needs.verify-and-build.outputs.tag }}
          path: ${{ runner.temp }}/dualdex-unsigned

      - name: Refuse to replace an existing signed asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-and-build.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace existing release $RELEASE_TAG. Use a new monotonically versioned RC."
            exit 1
          fi

      - name: Reconstruct key, verify signer, sign, and verify APK
        id: signing
        shell: bash
        env:
          DUALDEX_RELEASE_KEYSTORE_B64: ${{ secrets.DUALDEX_RELEASE_KEYSTORE_B64 }}
          DUALDEX_RELEASE_STORE_PASSWORD: ${{ secrets.DUALDEX_RELEASE_STORE_PASSWORD }}
          DUALDEX_RELEASE_KEY_ALIAS: ${{ secrets.DUALDEX_RELEASE_KEY_ALIAS }}
          DUALDEX_RELEASE_KEY_PASSWORD: ${{ secrets.DUALDEX_RELEASE_KEY_PASSWORD }}
          EXPECTED_APPLICATION_ID: ${{ needs.verify-and-build.outputs.application_id }}
          EXPECTED_CERTIFICATE_SHA256: ${{ needs.verify-and-build.outputs.certificate_sha256 }}
          EXPECTED_VERSION_CODE: ${{ needs.verify-and-build.outputs.version_code }}
          EXPECTED_VERSION_NAME: ${{ needs.verify-and-build.outputs.version_name }}
          RELEASE_TAG: ${{ needs.verify-and-build.outputs.tag }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/dualdex-release.jks"
          certificate_der="$RUNNER_TEMP/dualdex-release.der"
          verification_log="$RUNNER_TEMP/apksigner-verification.txt"
          cleanup() {
            rm -f "$keystore" "$certificate_der"
          }
          trap cleanup EXIT

          for required in \
            DUALDEX_RELEASE_KEYSTORE_B64 \
            DUALDEX_RELEASE_STORE_PASSWORD \
            DUALDEX_RELEASE_KEY_ALIAS \
            DUALDEX_RELEASE_KEY_PASSWORD; do
            [[ -n "${!required:-}" ]] || {
              echo "Protected signing secret $required is unavailable."
              exit 1
            }
          done

          printf '%s' "$DUALDEX_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          keytool -list \
            -keystore "$keystore" \
            -storepass:env DUALDEX_RELEASE_STORE_PASSWORD \
            -alias "$DUALDEX_RELEASE_KEY_ALIAS" >/dev/null
          keytool -exportcert \
            -keystore "$keystore" \
            -storepass:env DUALDEX_RELEASE_STORE_PASSWORD \
            -alias "$DUALDEX_RELEASE_KEY_ALIAS" \
            -file "$certificate_der"

          actual_certificate_sha256="$(sha256sum "$certificate_der" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
          [[ "$actual_certificate_sha256" == "$EXPECTED_CERTIFICATE_SHA256" ]] || {
            echo "Protected keystore certificate does not match the pinned public certificate."
            exit 1
          }

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          export PATH="$(dirname "$apksigner_path"):$PATH"
          unsigned_apk="$RUNNER_TEMP/dualdex-unsigned/DualDex-$RELEASE_TAG-unsigned.apk"
          assets="$RUNNER_TEMP/release-assets"
          signed_apk="$assets/DualDex-$RELEASE_TAG.apk"
          mkdir -p "$assets"

          zipalign -c -P 16 4 "$unsigned_apk"
          apksigner sign \
            --ks "$keystore" \
            --ks-key-alias "$DUALDEX_RELEASE_KEY_ALIAS" \
            --ks-pass env:DUALDEX_RELEASE_STORE_PASSWORD \
            --key-pass env:DUALDEX_RELEASE_KEY_PASSWORD \
            --out "$signed_apk" \
            "$unsigned_apk"
          apksigner verify --verbose --print-certs "$signed_apk" | tee "$verification_log"

          signer_sha256="$(sed -n -E 's/^(Signer #[0-9]+|V[0-9.]+ Signer):? certificate SHA-256 digest: //p' "$verification_log" | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          [[ "$signer_sha256" == "$EXPECTED_CERTIFICATE_SHA256" ]] || {
            echo "Signed APK certificate does not match the pinned fingerprint."
            exit 1
          }
          badging="$(aapt dump badging "$signed_apk" | head -n 1)"
          [[ "$badging" == *"name='$EXPECTED_APPLICATION_ID'"* ]]
          [[ "$badging" == *"versionCode='$EXPECTED_VERSION_CODE'"* ]]
          [[ "$badging" == *"versionName='$EXPECTED_VERSION_NAME'"* ]]

          echo "assets=$assets" >> "$GITHUB_OUTPUT"
          echo "apk=$signed_apk" >> "$GITHUB_OUTPUT"

      - name: Generate release checksums and provenance
        shell: bash
        env:
          ASSETS: ${{ steps.signing.outputs.assets }}
          APK: ${{ steps.signing.outputs.apk }}
          CERTIFICATE_SHA256: ${{ needs.verify-and-build.outputs.certificate_sha256 }}
          RELEASE_KIND: ${{ needs.verify-and-build.outputs.release_kind }}
          RELEASE_TAG: ${{ needs.verify-and-build.outputs.tag }}
          VERSION_CODE: ${{ needs.verify-and-build.outputs.version_code }}
          VERSION_NAME: ${{ needs.verify-and-build.outputs.version_name }}
        run: |
          set -euo pipefail
          cp signing/dualdex-release-cert.pem "$ASSETS/dualdex-release-cert.pem"
          cp reports/dualdex-parser-compatibility.json "$ASSETS/dualdex-parser-compatibility.json"
          cp reports/dualdex-parser-compatibility.md "$ASSETS/dualdex-parser-compatibility.md"
          cp reports/dualdex-rom-hacks-compatibility.json "$ASSETS/dualdex-rom-hacks-compatibility.json"
          cp reports/dualdex-rom-hacks-compatibility.md "$ASSETS/dualdex-rom-hacks-compatibility.md"
          cp docs/reports/2026-08-13-base-first50-release-gate.json "$ASSETS/dualdex-base-first50-release-gate.json"
          cp docs/reports/2026-08-13-base-first50-release-gate.md "$ASSETS/dualdex-base-first50-release-gate.md"
          cp docs/reports/2026-08-13-base-full332-compatibility-summary.json "$ASSETS/dualdex-base-full332-compatibility-summary.json"
          cp docs/reports/2026-08-13-base-full332-compatibility.md "$ASSETS/dualdex-base-full332-compatibility.md"
          cp docs/reports/2026-08-13-map-first50-release-gate-raw.json "$ASSETS/dualdex-map-first50-release-gate.json"
          cp docs/reports/2026-08-13-map-first50-release-gate.md "$ASSETS/dualdex-map-first50-release-gate.md"
          cp docs/reports/2026-08-14-first50-evolution-completeness-raw.json "$ASSETS/dualdex-evolution-first50-release-gate.json"
          cp docs/reports/2026-08-14-first50-evolution-completeness.md "$ASSETS/dualdex-evolution-first50-release-gate.md"
          cp docs/reports/arm7-first50-compatibility-survey.md "$ASSETS/dualdex-arm7-first50-compatibility.md"
          cp docs/reports/2026-08-19-v1.1-player-state-verification.md "$ASSETS/dualdex-v1.1-player-state-verification.md"
          cp docs/reports/2026-08-20-unbound-odyssey-static-completion.md "$ASSETS/dualdex-unbound-odyssey-static-completion.md"
          cp docs/reports/2026-08-20-unbound-odyssey-map-completion.md "$ASSETS/dualdex-unbound-odyssey-map-completion.md"
          cp docs/reports/2026-08-20-unbound-odyssey-save-runtime-completion.md "$ASSETS/dualdex-unbound-odyssey-save-runtime-completion.md"
          cp docs/reports/2026-08-20-unbound-odyssey-parser-completion.md "$ASSETS/dualdex-unbound-odyssey-parser-completion.md"
          cp docs/reports/2026-08-20-rom-derived-companion-theme.md "$ASSETS/dualdex-rom-derived-companion-theme.md"
          cp docs/reports/2026-08-20-gen2-gen3-dynamic-local-map-lighting.md "$ASSETS/dualdex-gen2-gen3-dynamic-local-map-lighting.md"
          cp docs/reports/2026-08-20-gen1-gen3-table-coverage.json "$ASSETS/dualdex-gen1-gen3-table-coverage.json"
          cp docs/reports/2026-08-20-gen1-gen3-table-coverage.md "$ASSETS/dualdex-gen1-gen3-table-coverage.md"
          cp docs/reports/2026-08-25-unified-game-state-compatibility.json "$ASSETS/dualdex-unified-game-state-compatibility.json"
          cp docs/reports/2026-08-25-unified-game-state-final-audit.md "$ASSETS/dualdex-unified-game-state-final-audit.md"
          cp docs/reports/passive-insights-progress/party-analysis-compatibility.json "$ASSETS/dualdex-party-analysis-compatibility.json"
          cp docs/reports/passive-insights-progress/party-analysis-audit.md "$ASSETS/dualdex-party-analysis-audit.md"
          cp docs/reports/passive-insights-progress/area-guide-compatibility.json "$ASSETS/dualdex-area-guide-compatibility.json"
          cp docs/reports/passive-insights-progress/area-guide-audit.md "$ASSETS/dualdex-area-guide-audit.md"
          cp docs/reports/passive-insights-progress/progress-timeline-compatibility.json "$ASSETS/dualdex-progress-timeline-compatibility.json"
          cp docs/reports/passive-insights-progress/progress-timeline-audit.md "$ASSETS/dualdex-progress-timeline-audit.md"
          cp docs/reports/passive-insights-progress/specimens-compatibility.json "$ASSETS/dualdex-specimens-compatibility.json"
          cp docs/reports/passive-insights-progress/specimens-audit.md "$ASSETS/dualdex-specimens-audit.md"
          cp docs/reports/passive-insights-progress/damage-forecast-compatibility.json "$ASSETS/dualdex-damage-forecast-compatibility.json"
          cp docs/reports/passive-insights-progress/damage-forecast-audit.md "$ASSETS/dualdex-damage-forecast-audit.md"
          cp docs/reports/passive-insights-progress/challenge-expansion-compatibility.json "$ASSETS/dualdex-challenge-expansion-compatibility.json"
          cp docs/reports/passive-insights-progress/challenge-expansion-audit.md "$ASSETS/dualdex-challenge-expansion-audit.md"
          cp docs/reports/passive-insights-progress/ui-conformance-audit.md "$ASSETS/dualdex-ui-conformance-audit.md"
          cp docs/reports/passive-insights-progress/ui-conformance-route-matrix.json "$ASSETS/dualdex-ui-conformance-route-matrix.json"
          cp docs/reports/passive-insights-progress/ui-conformance-font-matrix.json "$ASSETS/dualdex-ui-conformance-font-matrix.json"
          cp docs/reports/passive-insights-progress/ui-conformance-font-matrix.md "$ASSETS/dualdex-ui-conformance-font-matrix.md"
          cp docs/reports/passive-insights-progress/ui-conformance-computed-styles.json "$ASSETS/dualdex-ui-conformance-computed-styles.json"
          cp docs/reports/passive-insights-progress/ui-conformance-screenshots.json "$ASSETS/dualdex-ui-conformance-screenshots.json"
          cp docs/reports/passive-insights-progress/ui-conformance-summary.json "$ASSETS/dualdex-ui-conformance-summary.json"
          cp docs/reports/passive-insights-progress/ui-conformance-summary.md "$ASSETS/dualdex-ui-conformance-summary.md"
          cp docs/reports/passive-insights-progress/qa-hardening-convergence.md "$ASSETS/dualdex-qa-hardening-convergence.md"
          cp docs/reports/2026-08-27-storage-and-guide-load-hardening.md "$ASSETS/dualdex-storage-guide-load-hardening.md"
          cp docs/reports/save-synchronized-knowledge-checkpoints.md "$ASSETS/dualdex-save-synchronized-knowledge-checkpoints.md"
          release_notes="release/RELEASE_NOTES_${RELEASE_TAG#v}.md"
          test -s "$release_notes"
          cp "$release_notes" "$ASSETS/RELEASE_NOTES.md"

          apk_sha256="$(sha256sum "$APK" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
          jq -n \
            --arg schema "1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg tag "$RELEASE_TAG" \
            --arg releaseKind "$RELEASE_KIND" \
            --arg versionName "$VERSION_NAME" \
            --arg versionCode "$VERSION_CODE" \
            --arg applicationId "com.darkaxt.dualdex" \
            --arg apkSha256 "$apk_sha256" \
            --arg certificateSha256 "$CERTIFICATE_SHA256" \
            '{
              schema: ($schema | tonumber),
              repository: $repository,
              commit: $commit,
              workflowRunId: $workflowRunId,
              tag: $tag,
              releaseKind: $releaseKind,
              versionName: $versionName,
              versionCode: ($versionCode | tonumber),
              applicationId: $applicationId,
              apkSha256: $apkSha256,
              certificateSha256: $certificateSha256,
              signingAuthority: "GitHub protected environment: release-signing"
            }' > "$ASSETS/provenance.json"

          (
            cd "$ASSETS"
            sha256sum \
              "$(basename "$APK")" \
              dualdex-release-cert.pem \
              dualdex-parser-compatibility.json \
              dualdex-parser-compatibility.md \
              dualdex-rom-hacks-compatibility.json \
              dualdex-rom-hacks-compatibility.md \
              dualdex-base-first50-release-gate.json \
              dualdex-base-first50-release-gate.md \
              dualdex-base-full332-compatibility-summary.json \
              dualdex-base-full332-compatibility.md \
              dualdex-map-first50-release-gate.json \
              dualdex-map-first50-release-gate.md \
              dualdex-evolution-first50-release-gate.json \
              dualdex-evolution-first50-release-gate.md \
              dualdex-arm7-first50-compatibility.md \
              dualdex-v1.1-player-state-verification.md \
              dualdex-unbound-odyssey-static-completion.md \
              dualdex-unbound-odyssey-map-completion.md \
              dualdex-unbound-odyssey-save-runtime-completion.md \
              dualdex-unbound-odyssey-parser-completion.md \
              dualdex-rom-derived-companion-theme.md \
              dualdex-gen2-gen3-dynamic-local-map-lighting.md \
              dualdex-gen1-gen3-table-coverage.json \
              dualdex-gen1-gen3-table-coverage.md \
              dualdex-unified-game-state-compatibility.json \
              dualdex-unified-game-state-final-audit.md \
              dualdex-party-analysis-compatibility.json \
              dualdex-party-analysis-audit.md \
              dualdex-area-guide-compatibility.json \
              dualdex-area-guide-audit.md \
              dualdex-progress-timeline-compatibility.json \
              dualdex-progress-timeline-audit.md \
              dualdex-specimens-compatibility.json \
              dualdex-specimens-audit.md \
              dualdex-damage-forecast-compatibility.json \
              dualdex-damage-forecast-audit.md \
              dualdex-challenge-expansion-compatibility.json \
              dualdex-challenge-expansion-audit.md \
              dualdex-ui-conformance-audit.md \
              dualdex-ui-conformance-route-matrix.json \
              dualdex-ui-conformance-font-matrix.json \
              dualdex-ui-conformance-font-matrix.md \
              dualdex-ui-conformance-computed-styles.json \
              dualdex-ui-conformance-screenshots.json \
              dualdex-ui-conformance-summary.json \
              dualdex-ui-conformance-summary.md \
              dualdex-qa-hardening-convergence.md \
              dualdex-storage-guide-load-hardening.md \
              dualdex-save-synchronized-knowledge-checkpoints.md \
              RELEASE_NOTES.md \
              provenance.json > SHA256SUMS.txt
          )

      - name: Create non-replacing GitHub release
        shell: bash
        env:
          ASSETS: ${{ steps.signing.outputs.assets }}
          DRAFT: ${{ needs.verify-and-build.outputs.draft }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify-and-build.outputs.prerelease }}
          RELEASE_KIND: ${{ needs.verify-and-build.outputs.release_kind }}
          RELEASE_TAG: ${{ needs.verify-and-build.outputs.tag }}
          VERSION_NAME: ${{ needs.verify-and-build.outputs.version_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace existing release $RELEASE_TAG."
            exit 1
          fi

          flags=()
          if [[ "$DRAFT" == "true" ]]; then flags+=(--draft); fi
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          title="DualDex $VERSION_NAME"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$title" \
            --notes-file "$ASSETS/RELEASE_NOTES.md" \
            "${flags[@]}" \
            "$ASSETS/DualDex-$RELEASE_TAG.apk" \
            "$ASSETS/SHA256SUMS.txt" \
            "$ASSETS/provenance.json" \
            "$ASSETS/dualdex-release-cert.pem" \
            "$ASSETS/dualdex-parser-compatibility.json" \
            "$ASSETS/dualdex-parser-compatibility.md" \
            "$ASSETS/dualdex-rom-hacks-compatibility.json" \
            "$ASSETS/dualdex-rom-hacks-compatibility.md" \
            "$ASSETS/dualdex-base-first50-release-gate.json" \
            "$ASSETS/dualdex-base-first50-release-gate.md" \
            "$ASSETS/dualdex-base-full332-compatibility-summary.json" \
            "$ASSETS/dualdex-base-full332-compatibility.md" \
            "$ASSETS/dualdex-map-first50-release-gate.json" \
            "$ASSETS/dualdex-map-first50-release-gate.md" \
            "$ASSETS/dualdex-evolution-first50-release-gate.json" \
            "$ASSETS/dualdex-evolution-first50-release-gate.md" \
            "$ASSETS/dualdex-arm7-first50-compatibility.md" \
            "$ASSETS/dualdex-v1.1-player-state-verification.md" \
            "$ASSETS/dualdex-unbound-odyssey-static-completion.md" \
            "$ASSETS/dualdex-unbound-odyssey-map-completion.md" \
            "$ASSETS/dualdex-unbound-odyssey-save-runtime-completion.md" \
            "$ASSETS/dualdex-unbound-odyssey-parser-completion.md" \
            "$ASSETS/dualdex-rom-derived-companion-theme.md" \
            "$ASSETS/dualdex-gen2-gen3-dynamic-local-map-lighting.md" \
            "$ASSETS/dualdex-gen1-gen3-table-coverage.json" \
            "$ASSETS/dualdex-gen1-gen3-table-coverage.md" \
            "$ASSETS/dualdex-unified-game-state-compatibility.json" \
            "$ASSETS/dualdex-unified-game-state-final-audit.md" \
            "$ASSETS/dualdex-party-analysis-compatibility.json" \
            "$ASSETS/dualdex-party-analysis-audit.md" \
            "$ASSETS/dualdex-area-guide-compatibility.json" \
            "$ASSETS/dualdex-area-guide-audit.md" \
            "$ASSETS/dualdex-progress-timeline-compatibility.json" \
            "$ASSETS/dualdex-progress-timeline-audit.md" \
            "$ASSETS/dualdex-specimens-compatibility.json" \
            "$ASSETS/dualdex-specimens-audit.md" \
            "$ASSETS/dualdex-damage-forecast-compatibility.json" \
            "$ASSETS/dualdex-damage-forecast-audit.md" \
            "$ASSETS/dualdex-challenge-expansion-compatibility.json" \
            "$ASSETS/dualdex-challenge-expansion-audit.md" \
            "$ASSETS/dualdex-ui-conformance-audit.md" \
            "$ASSETS/dualdex-ui-conformance-route-matrix.json" \
            "$ASSETS/dualdex-ui-conformance-font-matrix.json" \
            "$ASSETS/dualdex-ui-conformance-font-matrix.md" \
            "$ASSETS/dualdex-ui-conformance-computed-styles.json" \
            "$ASSETS/dualdex-ui-conformance-screenshots.json" \
            "$ASSETS/dualdex-ui-conformance-summary.json" \
            "$ASSETS/dualdex-ui-conformance-summary.md" \
            "$ASSETS/dualdex-qa-hardening-convergence.md" \
            "$ASSETS/dualdex-storage-guide-load-hardening.md" \
            "$ASSETS/dualdex-save-synchronized-knowledge-checkpoints.md" \
            "$ASSETS/RELEASE_NOTES.md"

          echo "GitHub created the non-replacing $RELEASE_KIND release for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
