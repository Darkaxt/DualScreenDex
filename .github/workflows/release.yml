          jq -e '.v11Rc63UnifiedTransientState == true and .v11Rc63CanonicalPokedexReplacement == true and .v11Rc63SaveChangedOnlyCheckpoint == true and .v11Rc63CrossGenerationLiveControls == true' release/v1-ready.json >/dev/null
          jq -e '.v11Rc67VisibleHeightScaling == true and .v11Rc67AlphaTrimmedComparisonSprites == true and .v11Rc67HeightBrowserGate == true' release/v1-ready.json >/dev/null
          jq -e '.v11Rc68PartyAnalysis == true' release/v1-ready.json >/dev/null
