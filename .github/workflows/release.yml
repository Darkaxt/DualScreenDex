            "$ASSETS/dualdex-specimens-compatibility.json" \
            "$ASSETS/dualdex-specimens-audit.md" \
            "$ASSETS/dualdex-damage-forecast-compatibility.json" \
            "$ASSETS/dualdex-damage-forecast-audit.md" \
            "$ASSETS/dualdex-challenge-expansion-compatibility.json" \
            "$ASSETS/dualdex-challenge-expansion-audit.md" \
            "$ASSETS/dualdex-ui-conformance-audit.md" \
            "$ASSETS/dualdex-ui-conformance-route-matrix.json" \
            "$ASSETS/dualdex-ui-conformance-font-matrix.json" \
            "$ASSETS/dualdex-ui-conformance-font-matrix.md" \
            "$ASSETS/dualdex-ui-conformance-computed-styles.json" \
            "$ASSETS/dualdex-ui-conformance-screenshots.json" \
            "$ASSETS/dualdex-ui-conformance-summary.json" \
            "$ASSETS/dualdex-ui-conformance-summary.md" \
            "$ASSETS/dualdex-qa-hardening-convergence.md" \
            "$ASSETS/dualdex-storage-guide-load-hardening.md" \
            "$ASSETS/dualdex-save-synchronized-knowledge-checkpoints.md" \
            "$ASSETS/dualdex-stage-07-corpus-evidence.json" \
            "$ASSETS/dualdex-stage-07-corpus-evidence.md" \
            "$ASSETS/dualdex-stage-07-corpus-execution.json" \
            "$ASSETS/dualdex-stage-07-closure.json" \
