name: Packaged Android acceptance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-android:
    name: Packaged Android managed device
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: companion-web/package-lock.json

      - name: Install locked web dependencies
        working-directory: companion-web
        run: npm ci

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Run installed APK and WebView acceptance
        shell: bash
        run: bash ./gradlew :app:qaApi35DebugAndroidTest --stacktrace

      - name: Create source-bound packaged acceptance evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          for screenshot in \
            01-packaged-bootstrap.png \
            02-index-failure.png \
            03-guide-failure.png \
            04-cache-reopen.png; do
            find app/build/outputs -type f -name "$screenshot" -print -quit | grep -q .
          done
          find app/build/outputs/androidTest-results/managedDevice -type f -name '*.xml' -print -quit | grep -q .

          evidence="$RUNNER_TEMP/packaged-android-evidence.json"
          apk_sha256="$(sha256sum "$apk" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
          jq -n \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg debugApkSha256 "$apk_sha256" \
            '{
              schema: 1,
              sourceCommit: $sourceCommit,
              workflowPath: ".github/workflows/packaged-android.yml",
              task: ":app:qaApi35DebugAndroidTest",
              status: "PASSED",
              applicationId: "com.darkaxt.dualdex.debug",
              debugApkSha256: $debugApkSha256,
              junitXmlPublished: true,
              screenshots: [
                "01-packaged-bootstrap.png",
                "02-index-failure.png",
                "03-guide-failure.png",
                "04-cache-reopen.png"
              ]
            }' > "$evidence"
          echo "path=$evidence" >> "$GITHUB_OUTPUT"

      - name: Upload immutable packaged acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dualdex-packaged-android-evidence
          path: ${{ steps.evidence.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload JUnit, reports, and bounded screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dualdex-packaged-android-results
          path: |
            app/build/outputs/androidTest-results/managedDevice/**
            app/build/outputs/managed_device_android_test_additional_output/**
            app/build/reports/androidTests/managedDevice/**
          if-no-files-found: warn
          retention-days: 14
