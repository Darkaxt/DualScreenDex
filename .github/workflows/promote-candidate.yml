name: Promote signed candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft candidate tag, such as v1.1.0-rc.73
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dualdex-candidate-promotion-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: release-promotion
    permissions:
      contents: write
      deployments: read
      actions: read
    steps:
      - name: Check out promotion record from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Require a default-branch candidate promotion record
        id: policy
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF_TYPE" == "branch" && "$WORKFLOW_REF_NAME" == "$DEFAULT_BRANCH" ]] || {
            echo "Candidate promotion must run from the repository default branch."
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*(-hotfix\.[1-9][0-9]*)?$ ]] || {
            echo "Promotion target is not a candidate tag."
            exit 1
          }
          record="release/candidate-promotions/$RELEASE_TAG.json"
          test -s "$record"
          echo "record=$record" >> "$GITHUB_OUTPUT"

      - name: Download the existing draft candidate evidence
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/candidate-assets"
          mkdir -p "$assets"
          release_json_file="$RUNNER_TEMP/initial-release.json"
          initial_release_assets="$RUNNER_TEMP/initial-release-assets.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$release_json_file"
          jq -e '.draft == true and .prerelease == true' "$release_json_file" >/dev/null
          release_id="$(jq -r '.id' "$release_json_file")"
          jq -e '[.assets[] | {
            name,
            id,
            sha256: (.digest | select(type == "string") | sub("^sha256:"; "") | ascii_upcase)
          }] | if all(.sha256 | test("^[A-F0-9]{64}$")) then . else error("missing asset digest") end' \
            "$release_json_file" > "$initial_release_assets"
          test -n "$release_id"
          test "$(jq 'length' "$initial_release_assets")" -gt 0

          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$assets"

          echo "assets=$assets" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "initial_release_assets=$initial_release_assets" >> "$GITHUB_OUTPUT"

      - name: Validate exact signed artifact and required gates
        shell: bash
        env:
          ASSETS: ${{ steps.candidate.outputs.assets }}
          RECORD: ${{ steps.policy.outputs.record }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          apk="$ASSETS/DualDex-$RELEASE_TAG.apk"
          verification_log="$RUNNER_TEMP/apksigner-verification.txt"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          export PATH="$(dirname "$apksigner_path"):$PATH"
          apksigner verify --verbose --print-certs "$apk" | tee "$verification_log"
          node tools/release/validate-candidate-promotion.mjs \
            --record "$RECORD" \
            --provenance "$ASSETS/provenance.json" \
            --checksums "$ASSETS/SHA256SUMS.txt" \
            --apk "$apk" \
            --certificate-fingerprint signing/dualdex-release-cert.sha256 \
            --apk-signer-verification "$verification_log" \
            --release-assets "${{ steps.candidate.outputs.initial_release_assets }}" \
            --assets-directory "$ASSETS"
          source_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$source_commit" \
            '.repository == $repository and .commit == $commit' \
            "$ASSETS/provenance.json" >/dev/null

      - name: Verify successful source-bound workflow evidence
        shell: bash
        env:
          ASSETS: ${{ steps.candidate.outputs.assets }}
          GH_TOKEN: ${{ github.token }}
          RECORD: ${{ steps.policy.outputs.record }}
        run: |
          set -euo pipefail
          source_commit="$(jq -r '.commit' "$ASSETS/provenance.json")"
          verify_run() {
            local url="$1"
            local expected_path="$2"
            local run_id="${url##*/}"
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" | jq -e \
              --arg commit "$source_commit" \
              --arg path "$expected_path" \
              --arg url "$url" \
              '.path == $path and .html_url == $url and .head_sha == $commit and
               .status == "completed" and .conclusion == "success"' >/dev/null
          }

          release_run_url="$(jq -r '.releaseWorkflowRunUrl' "$RECORD")"
          verify_run "$release_run_url" ".github/workflows/release.yml"
          validation_mode="$(jq -r '.validationMode' "$RECORD")"
          case "$validation_mode" in
            packaged-android-and-thor)
              validation_run_url="$(jq -r '.packagedAndroidWorkflowRunUrl' "$RECORD")"
              verify_run "$validation_run_url" ".github/workflows/release.yml"
              validation_run_id="${validation_run_url##*/}"
              artifact_json="$(
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$validation_run_id/artifacts?per_page=100" | \
                  jq -c '.artifacts | map(select(.name == "dualdex-packaged-android-evidence" and .expired == false)) | if length == 1 then .[0] else empty end'
              )"
              test -n "$artifact_json"
              artifact_id="$(jq -r '.id' <<< "$artifact_json")"
              artifact_digest="$(jq -r '.digest' <<< "$artifact_json")"
              expected_artifact_digest="$(jq -r '.packagedAndroidEvidenceArtifactDigest' "$RECORD")"
              [[ "$artifact_digest" == "$expected_artifact_digest" ]]
              packaged_evidence="$RUNNER_TEMP/packaged-android-evidence"
              mkdir -p "$packaged_evidence"
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
                > "$RUNNER_TEMP/packaged-android-evidence.zip"
              unzip -q "$RUNNER_TEMP/packaged-android-evidence.zip" -d "$packaged_evidence"
              jq -e \
                --arg commit "$source_commit" \
                '.schema == 1 and .sourceCommit == $commit and
                 .workflowPath == ".github/workflows/packaged-android.yml" and
                 .task == ":app:qaApi35DebugAndroidTest" and .status == "PASSED" and
                 .applicationId == "com.darkaxt.dualdex.debug" and
                 (.debugApkSha256 | test("^[A-F0-9]{64}$")) and
                 .junitXmlPublished == true and
                 .screenshots == ["01-packaged-bootstrap.png", "02-index-failure.png", "03-guide-failure.png", "04-cache-reopen.png"]' \
                "$packaged_evidence/packaged-android-evidence.json" >/dev/null
              ;;
            automated-passive-catalog)
              validation_run_url="$(jq -r '.automatedValidationWorkflowRunUrl' "$RECORD")"
              verify_run "$validation_run_url" ".github/workflows/ci.yml"
              evidence_path="$(jq -r '.automatedEvidencePath' "$RECORD")"
              expected_evidence_sha="$(jq -r '.automatedEvidenceSha256 | ascii_upcase' "$RECORD")"
              test -f "$evidence_path"
              actual_evidence_sha="$(sha256sum "$evidence_path" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
              [[ "$actual_evidence_sha" == "$expected_evidence_sha" ]]
              jq -e \
                --arg tag "$(jq -r '.candidateTag' "$RECORD")" \
                --arg apk_sha "$(jq -r '.apkSha256 | ascii_upcase' "$RECORD")" \
                --arg commit "$source_commit" \
                --arg validation_run_url "$validation_run_url" \
                '.schema == 1 and .candidateTag == $tag and
                 (.apkSha256 | ascii_upcase) == $apk_sha and .sourceCommit == $commit and
                 .validationMode == "automated-passive-catalog" and
                 .automatedValidationWorkflowRunUrl == $validation_run_url and
                 .userAuthorizedAutomatedPromotion == true and .gameplayRuntimeChanged == false and
                 .catalogPersistenceValidated == true and .runtimeApiValidated == true and
                 .webPresentationValidated == true and .releaseCiValidated == true and
                 (.controls | type) == "array" and (.controls | length) >= 5 and
                 (.controls | map(.romSha256) | unique | length) == (.controls | length) and
                 (.controls | all(.romSha256 | test("^[A-Fa-f0-9]{64}$"))) and
                 (.controls | all(.catalogPersistenceValidated == true and
                                  .runtimeApiValidated == true and
                                  .webPresentationValidated == true))' \
                "$evidence_path" >/dev/null
              ;;
            *)
              echo "Unsupported validation mode after record validation: $validation_mode"
              exit 1
              ;;
          esac

      - name: Recheck protected environment governance
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          public_api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          fetch_public_policy() {
            curl --fail --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$public_api/$1"
          }
          ruleset_list="$RUNNER_TEMP/promotion-rulesets-list.json"
          rulesets="$RUNNER_TEMP/promotion-rulesets.json"
          signing_environment="$RUNNER_TEMP/promotion-release-signing-environment.json"
          signing_policies="$RUNNER_TEMP/promotion-release-signing-policies.json"
          promotion_environment="$RUNNER_TEMP/promotion-release-promotion-environment.json"
          promotion_policies="$RUNNER_TEMP/promotion-release-promotion-policies.json"
          fetch_public_policy "rulesets?includes_parents=true&targets=tag" > "$ruleset_list"
          printf '[]\n' > "$rulesets"
          while read -r ruleset_id; do
            [[ "$ruleset_id" =~ ^[0-9]+$ ]]
            detail="$RUNNER_TEMP/promotion-ruleset-$ruleset_id.json"
            combined="$RUNNER_TEMP/promotion-rulesets-next.json"
            fetch_public_policy "rulesets/$ruleset_id" > "$detail"
            jq --slurp '.[0] + [.[1]]' "$rulesets" "$detail" > "$combined"
            mv "$combined" "$rulesets"
          done < <(jq -r '.[].id' "$ruleset_list")
          fetch_public_policy "environments/release-signing" > "$signing_environment"
          fetch_public_policy "environments/release-signing/deployment-branch-policies" > "$signing_policies"
          fetch_public_policy "environments/release-promotion" > "$promotion_environment"
          fetch_public_policy "environments/release-promotion/deployment-branch-policies" > "$promotion_policies"
          promotion_signing_secret_reference_count=0
          node tools/release/verify-repository-policy.mjs \
            --rulesets "$rulesets" \
            --signing-environment "$signing_environment" \
            --signing-environment-policies "$signing_policies" \
            --promotion-environment "$promotion_environment" \
            --promotion-environment-policies "$promotion_policies" \
            --promotion-signing-secret-reference-count "$promotion_signing_secret_reference_count" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG"

      - name: Promote the same immutable release asset
        shell: bash
        env:
          ASSETS: ${{ steps.candidate.outputs.assets }}
          GH_TOKEN: ${{ github.token }}
          INITIAL_RELEASE_ASSETS: ${{ steps.candidate.outputs.initial_release_assets }}
          RECORD: ${{ steps.policy.outputs.record }}
          RELEASE_ID: ${{ steps.candidate.outputs.release_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          current_release="$RUNNER_TEMP/current-release.json"
          current_release_assets="$RUNNER_TEMP/current-release-assets.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$current_release"
          jq -e \
            --argjson release_id "$RELEASE_ID" \
            '.id == $release_id and .draft == true and .prerelease == true' \
            "$current_release" >/dev/null
          jq -e '[.assets[] | {
            name,
            id,
            sha256: (.digest | select(type == "string") | sub("^sha256:"; "") | ascii_upcase)
          }] | if all(.sha256 | test("^[A-F0-9]{64}$")) then . else error("missing asset digest") end' \
            "$current_release" > "$current_release_assets"
          cmp --silent "$INITIAL_RELEASE_ASSETS" "$current_release_assets" || {
            echo "The public release asset set changed after validation."
            exit 1
          }
          node tools/release/validate-candidate-promotion.mjs \
            --record "$RECORD" \
            --release-assets "$current_release_assets" \
            --assets-directory "$ASSETS" \
            --asset-set-only true

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=true >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq 'select(.draft == false and .prerelease == true) | .html_url'
          echo "Promoted the existing signed asset for $RELEASE_TAG without replacement." \
            >> "$GITHUB_STEP_SUMMARY"
