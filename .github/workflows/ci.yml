name: CI

on:
  push:
    branches:
      - master
      - codex/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: companion-web/package-lock.json

      - name: Install web dependencies
        working-directory: companion-web
        run: npm ci

      - name: Test release policy
        run: node --test tools/release/*.test.mjs

      - name: Test Android deployment safety
        run: pwsh -File tools/android/Test-DualDexAndroidTools.ps1

      - name: Run Kotlin tests
        run: .\gradlew.bat :parser-core:test :parser-cli:test :companion-core:test :companion-simulator:test :companion-server:test --stacktrace

      - name: Test web UI
        working-directory: companion-web
        run: npm test -- --run

      - name: Build production web assets
        working-directory: companion-web
        run: npm run build

      - name: Assemble debug APK
        run: .\gradlew.bat :app:assembleDebug :app:lintDebug --stacktrace

      - name: Verify debug identity
        shell: pwsh
        run: |
          $aapt = Get-ChildItem "$env:ANDROID_HOME\build-tools" -Filter aapt.exe -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          $badging = & $aapt dump badging app\build\outputs\apk\debug\app-debug.apk | Select-Object -First 1
          if ($badging -notmatch "name='com\.darkaxt\.dualdex\.debug'") {
            throw "Unexpected debug package: $badging"
          }

      - name: Verify tracked-file whitespace
        run: git diff --check
